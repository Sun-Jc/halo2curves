[package]
name = "msm-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
# halo2curves — optimized (opt/msm-fast branch on Sun-Jc fork, v0.9.1)
halo2curves = { git = "https://github.com/Sun-Jc/halo2curves.git", branch = "opt/msm-fast", features = ["std"] }
# halo2curves — baseline (upstream main branch, v0.9.0)
halo2curves_baseline = { git = "https://github.com/privacy-scaling-explorations/halo2curves.git", branch = "main", package = "halo2curves", features = ["std"] }

ff = "0.13"
group = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1.8"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
incremental = false
codegen-units = 1
