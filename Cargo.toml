[package]
name = "msm-bench"
version = "0.2.0"
edition = "2021"

[dependencies]
# 1. Baseline — upstream main (v0.9.0)
halo2curves_baseline = { git = "https://github.com/privacy-scaling-explorations/halo2curves.git", branch = "main", package = "halo2curves", features = ["std"] }
# 2. CPU-improved (v0.9.1, Sun-Jc fork)
halo2curves_cpu = { git = "https://github.com/Sun-Jc/halo2curves.git", branch = "v0.9.1", package = "halo2curves", features = ["std"] }
# 3. GPU Metal (v0.9.2, Sun-Jc fork)
halo2curves_gpu = { git = "https://github.com/Sun-Jc/halo2curves.git", branch = "v0.9.2", package = "halo2curves", features = ["std", "gpu"] }

ff = "0.13"
group = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1.8"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
incremental = false
codegen-units = 1
